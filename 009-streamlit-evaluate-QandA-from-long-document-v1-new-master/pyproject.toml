[project]
name = "streamlit-evaluate-qanda-from-long-document-modern"
version = "0.2.0"
description = "Modern version of streamlit RAG evaluation app with updated dependencies"
authors = [
    {name = "julio colomer", email = "info@aiaccelera.com"}
]
readme = "README.md"
requires-python = ">=3.13.3"
dependencies = [
    "streamlit>=1.49.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "faiss-cpu>=1.9.0",
    "tiktoken>=0.8.0"
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.1.1",
    "ipykernel>=6.29.0",
    "black>=24.0.0",
    "ruff>=0.8.0"
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false